name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Testcontainers (Postgres + Redis) spin up their own containers via
      # the Docker daemon already available on GitHub-hosted runners - no
      # separate `services:` block needed.
      - name: Build and verify (unit + integration tests)
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
