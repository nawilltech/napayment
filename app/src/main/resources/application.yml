spring:
  application:
    name: nawill-pay
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  datasource:
    url: ${NAWILL_DB_URL}
    username: ${NAWILL_DB_USERNAME}
    password: ${NAWILL_DB_PASSWORD}
  data:
    redis:
      host: ${NAWILL_REDIS_HOST}
      port: ${NAWILL_REDIS_PORT}
      password: ${NAWILL_REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          # Port 465 is implicit TLS (SMTPS), not STARTTLS on 587 - ssl.enable
          # wraps the socket in TLS from the start of the connection.
          ssl:
            enable: true

server:
  port: ${SERVER_PORT:8080}

management:
  health:
    mail:
      # SMTP reachability is not a signal of application health - an
      # unreachable/misconfigured mail server (e.g. placeholder creds in an
      # environment that hasn't set up real SMTP yet) shouldn't fail the
      # deploy health check the app is otherwise up and serving traffic.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Alphabetical section headings (tags) and, within each, alphabetical
    # operations - springdoc/swagger-ui default order is declaration order,
    # which drifts as controllers are added.
    tags-sorter: alpha
    operations-sorter: alpha

nawill:
  auth:
    jwt:
      secret: ${AUTH_JWT_SECRET}
      expiry-minutes: ${AUTH_JWT_EXPIRY_MINUTES:15}
      refresh-expiry-days: ${AUTH_JWT_REFRESH_EXPIRY_DAYS:30}
    superadmin:
      email: ${AUTH_SUPERADMIN_EMAIL}
      password: ${AUTH_SUPERADMIN_PASSWORD}
  security:
    encryption-key: ${NAWILL_ENCRYPTION_KEY}
  storage:
    local:
      # TODO(FE-Gap, doc F9): local-disk stand-in for KYC document/attachment
      # storage - see common-core's FileStorageGateway Javadoc for the
      # production swap-out story (S3-compatible object storage).
      base-dir: ${NAWILL_STORAGE_LOCAL_BASE_DIR:./.data/uploads}
  notifications:
    email-from: ${SMTP_FROM}
  frontend:
    # Base URL of napayment-fe, used to build absolute links sent outside the
    # app (team-invite emails/inviteUrl) - a bare path like "/invite/<token>"
    # is meaningless outside the browser session that generated it.
    base-url: ${FRONTEND_BASEURL}
  paystack:
    base-url: https://api.paystack.co
    # One key per environment (twelve-factor): each environment's own env
    # supplies its key; the app never chooses test vs live. Optional -
    # unset means name enquiry is unavailable (a fake stands in under test).
    secret-key: ${PAYSTACK_PRIVATE_KEY:}
