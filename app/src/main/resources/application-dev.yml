# Local development against the docker-compose.yml stack (postgres, redis).
# Safe non-secret defaults only - never use these values in staging/prod.
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/nawill_pay
    username: nawill
    password: nawill
  data:
    redis:
      host: localhost
      port: 16379
  jpa:
    show-sql: true

management:
  endpoint:
    health:
      show-details: always

nawill:
  auth:
    jwt:
      secret: ${AUTH_JWT_SECRET:dev-only-jwt-signing-secret-change-me-32-bytes-min}
    superadmin:
      email: ${AUTH_SUPERADMIN_EMAIL:nawilltechltd@gmail.com}
      password: ${AUTH_SUPERADMIN_PASSWORD:SuperAdmin?1@}
  security:
    # Dev-only AES-256 key (base64) - never use this in staging/prod; there
    # it must come from a real secret, same posture as AUTH_JWT_SECRET.
    encryption-key: ${NAWILL_ENCRYPTION_KEY:XLIbp3fqy/rVmRz+R6U8LIXfN1kpEJ4rwcKkH4yDA8U=}

logging:
  level:
    ng.com.nawill.pay: DEBUG
