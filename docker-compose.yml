services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nawill_pay
      POSTGRES_USER: nawill
      POSTGRES_PASSWORD: nawill
    ports:
      - "15432:5432"
    volumes:
      - nawill-pay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nawill -d nawill_pay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nawill-pay-postgres-data:
