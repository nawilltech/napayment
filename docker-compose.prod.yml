services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: napayment-api
    restart: unless-stopped
    # .env supplies everything (DATABASE creds, JWT/encryption secrets, SMTP,
    # ...) - written from the API_ENV_FILE GitHub secret on every deploy, not
    # committed. Postgres/Redis are the shared containers already running on
    # nawill-net (see /opt/stack/docker-compose.yml on the host), reached by
    # their service names, not localhost.
    env_file:
      - .env
    networks:
      - nawill-net
    mem_limit: 512m
    volumes:
      # LocalFileStorageGateway writes KYC uploads under /app/.data -
      # without this, every deploy's `up -d --build` recreates the
      # container and silently wipes them (this is still a stopgap,
      # single-instance, unbacked-up disk store - see the gateway's own
      # Javadoc for the real fix, swapping to S3-compatible storage).
      - napayment-uploads:/app/.data

networks:
  nawill-net:
    external: true

volumes:
  napayment-uploads:
